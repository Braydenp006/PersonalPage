<!-- page cover: here (not in style.css) so it's in place from the very first frame; site.js lifts it -->
<style>html{background:#1e1813}body::after{content:"";position:fixed;inset:0;z-index:999;background:#1e1813;pointer-events:none;opacity:1;transition:opacity .75s ease}html.ready body::after{opacity:0}html.leaving body::after{opacity:1;transition:opacity .4s ease}html.gone body::after{display:none}</style>
<script>setTimeout(() => { const h = document.documentElement; h.classList.add('ready'); setTimeout(() => h.classList.contains('leaving') || h.classList.add('gone'), 800) }, 4000) // safety: never leave the page covered</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<nav id="nav">
  <div class="wrap">
    <a href="index.html" class="logo"><img src="info/Icon.jpg" alt="">Bandits Custom Tables</a>

<!-- Every photo in img/ shows up here by itself (see "Gallery page" in site.js). -->
<main class="full-gallery photo-band" style="--band:url(img/backsplash/slab1.jpg)">
  <div class="wrap car-block" id="all-photos" data-fit>
    <div class="carousel" tabindex="0" aria-label="All our photos"></div>
    <div class="car-ctrl"><span class="car-count"></span><div class="scrub" role="slider" tabindex="0" aria-label="Move through the photos" aria-valuemin="1"><div class="scrub-fill"></div><div class="scrub-dot"></div></div></div>
  </div>
</main>

<div class="lb" id="lb" onclick="closeLb()"><img alt=""><p class="caps lb-cap"></p></div>

<script src="site.js"></script>
</body>
