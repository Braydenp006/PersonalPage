<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FloodFill · Brayden Paterson</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font:18px/1.4 system-ui,sans-serif}
  main{width:min(440px,100vw);padding:16px;box-sizing:border-box;text-align:center}
  h1{font-size:32px;font-weight:400;margin:0 0 4px}
  p{margin:0 0 16px;color:#a1a1aa}
  .grid{display:grid;margin:0 auto 16px;width:min(396px,100%);aspect-ratio:1;border:2px solid #333}
  .grid button{border:0;padding:0;margin:0;cursor:pointer}
  .grid button:focus-visible{outline:3px solid #ffc46e;outline-offset:-3px}
  .bar{display:flex;gap:12px;justify-content:center}
  .bar button{background:#fff;color:#000;border:0;font:18px system-ui,sans-serif;padding:8px 18px;cursor:pointer}
  .bar button:focus-visible{outline:3px solid #ffc46e;outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>FloodFill</h1>
  <p>Click any square and watch the colour spread.</p>
  <div class="grid" id="grid"></div>
  <div class="bar"><button data-g="face">Face</button><button data-g="random">Random</button></div>
</main>
<script>
// A port of github.com/Braydenp006/FloodFill (FloodFill.java): the same 4-way fill, drawn one square at a time.
const GRIDS = {   // the repo's face.txt and random.txt
  face: ['11111111111','11111111111','11100000111','11011111011','11017171011','11011111011','11010001011','11011111011','11100000111','11111111111','11111111111'],
  random: ['10011110111','10011011011','10110000011','10111111011','10000111011','11011111011','11111111000','10110000011','11110111111','01010111000','11111111111'],
};
const COLORS = { 0: '#000', 1: '#fff', 3: '#808080', 4: '#f00', 5: '#00f', 6: '#ff0', 7: '#0f0', 8: '#f0f', 9: '#0ff' };   // the same colour codes the Java used
const FILLS = [6, 4, 5, 7, 8, 9];
let arr, n = 0, timer;
const grid = document.getElementById('grid');
function paint(r, c) { grid.children[r * arr[0].length + c].style.background = COLORS[arr[r][c]]; }
function load(name) {
  clearTimeout(timer);
  arr = GRIDS[name].map(row => [...row].map(Number));
  grid.style.gridTemplate = `repeat(${arr.length}, 1fr) / repeat(${arr[0].length}, 1fr)`;
  grid.replaceChildren(...arr.flatMap((row, r) => row.map((_, c) => { const b = document.createElement('button'); b.setAttribute('aria-label', `Row ${r + 1}, column ${c + 1}`); b.onclick = () => fill(r, c); return b; })));
  arr.forEach((row, r) => row.forEach((_, c) => paint(r, c)));
}
function fill(row, col) {   // explicit stack, so a big grid can't overflow the call stack like the recursive Java could
  clearTimeout(timer);
  const target = arr[row][col];
  let repl = FILLS[n++ % FILLS.length];
  if (repl === target) repl = FILLS[n++ % FILLS.length];   // filling a colour with itself would never stop
  const stack = [[row, col]];
  (function step() {
    for (let k = 0; k < 2 && stack.length; k++) {   // two squares per frame
      const [r, c] = stack.pop();
      if (arr[r]?.[c] !== target) { k--; continue; }
      arr[r][c] = repl; paint(r, c);
      stack.push([r, c + 1], [r, c - 1], [r + 1, c], [r - 1, c]);
    }
    if (stack.length) timer = setTimeout(step, 30);
  })();
}
document.querySelectorAll('.bar button').forEach(b => b.onclick = () => load(b.dataset.g));
load('face');
</script>
</body>
</html>
